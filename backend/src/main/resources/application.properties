# ============================================================
# OccasionWear backend configuration
# Local development uses MySQL provided by XAMPP.
# Every connection setting can be overridden with environment
# variables so no production credentials are hard-coded.
# ============================================================

spring.application.name=occasionwear
server.port=${SERVER_PORT:8080}

# ---- Database (MySQL through XAMPP) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/occasionwear?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
occasionwear.jwt.secret=${JWT_SECRET:U2VjdXJlT2NjYXNpb25XZWFySnN3dFNlY3JldEtleVdoaWNoTWV0Y2hTdHJvbmdseMOP5kN1c3RvbXk=}
occasionwear.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- Business rule constants ----
# Late-return policy: the rental period is fixed (wedding wear → 5 days,
# all other outfits → 3 days). On-time returns are free; every day beyond the
# expected return date is charged at 2,000 RWF (per-outfit lateFeePerDay
# overrides this default). No grace allowance.
occasionwear.fees.late-per-day=${LATE_FEE_PER_DAY:2000}

# ---- Swagger / OpenAPI ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.occasionwear.controller

# ---- Error handling ----
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=never
